[package]
name = "moonbridge-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Moon Bridge Next — 本地 LLM 网关（Tauri 桌面壳）"

[lib]
name = "moonbridge_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[[bin]]
name = "moonbridge-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
# 内部 crate（依赖方向：app → gateway, store, core）
moonbridge-core = { workspace = true }
moonbridge-store = { workspace = true }
moonbridge-gateway = { workspace = true }

# Tauri 与插件
tauri = { workspace = true, features = ["image-png"] }
tauri-plugin-log = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-window-state = { workspace = true }

# 基础设施
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }

# 桌面平台专用：单实例（须在 Builder 最早注册）
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { workspace = true }
