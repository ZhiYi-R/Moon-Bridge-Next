name: Release

# 触发：推送 Release 前缀的 tag（如 Release/0.1.0、Release-0.1.0）。
on:
  push:
    tags:
      - "Release*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux：deb / rpm / pacman / AppImage ──
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage,pacman
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage,pacman
          # ── macOS：DMG（无证书 → ad-hoc 签名）；x86_64 在 arm runner 交叉编译 ──
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          # ── Windows：NSIS 安装包（简体中文）──
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
    env:
      # macOS 未配置 Apple 证书：'-' 即 ad-hoc 签名，产物可直接本机运行
      APPLE_SIGNING_IDENTITY: "-"
      # linuxdeploy AppImage 在 CI runner 上无 FUSE 可用，改为解压运行
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file patchelf libssl-dev rpm \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Setup LLVM for Windows ARM64
        if: runner.os == 'Windows' && matrix.name == 'windows-arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmBin = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path $llvmBin)) { throw "LLVM not found at $llvmBin" }
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install frontend dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Install Tauri CLI
        shell: bash
        run: npm install -g @tauri-apps/cli@^2

      - name: Build Tauri app
        shell: bash
        run: tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # 产物自带架构后缀（amd64/arm64、x64/arm64、aarch64），无需重命名
      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f \( \
            -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.pkg.tar.zst' -o \
            -name '*.dmg' -o -name '*-setup.exe' \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Moon Bridge Next ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## Moon Bridge Next ${{ github.ref_name }}

            ### 下载

            - **Linux x86_64**：`*_amd64.deb` / `*.x86_64.rpm` / `*_x86_64.pkg.tar.zst` / `*_amd64.AppImage`
            - **Linux arm64**：`*_arm64.deb` / `*.aarch64.rpm` / `*_aarch64.pkg.tar.zst` / `*_aarch64.AppImage`
            - **macOS**：`*_aarch64.dmg`（Apple Silicon）/ `*_x64.dmg`（Intel）
            - **Windows**：`*_x64-setup.exe` / `*_arm64-setup.exe`（NSIS 安装包，简体中文）

            > macOS 构建为 ad-hoc 签名：首次打开若被 Gatekeeper 拦截，右键 →「打开」即可。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
