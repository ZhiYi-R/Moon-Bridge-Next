# soul 服务器部署样例：用 moonbridge-next 替换老 Go moonbridge。
#
# 用法（在 soul 上，本目录内）：
#   1. 本地（macOS）构建并导出镜像：
#        docker build -t moonbridge-next:local .          # 仓库根执行
#        docker save moonbridge-next:local | gzip > moonbridge-next-local.tgz
#      scp 到 soul 后导入：
#        gunzip -c moonbridge-next-local.tgz | docker load
#   2. 准备数据目录与环境变量（容器以 uid 10001 运行，宿主目录必须归它所有，
#      否则 ./data 覆盖镜像内 /data 后无法写数据库与配置）：
#        mkdir -p data && chown -R 10001:10001 data
#        cp .env.example .env && chmod 600 .env           # 填入两个不同的非空 token
#   3. 升级前停止旧服务并备份数据库及匹配密钥；旧镜像不能直接使用升级后的加密库。
#      原共享 token 填 MOONBRIDGE_GATEWAY_TOKEN，另生成不同的 MOONBRIDGE_ADMIN_TOKEN，
#      模型客户端不改 key；浏览器使用新管理 token。
#   4. 启动 / 更新：
#        docker compose up -d
#        docker compose logs -f moonbridge
#
# 说明：
#   - 端口 38440 对宿主机开放；公网入口由 openresty（1Panel）反代，再往上是 Cloudflare。
#     前端页面与 /api/* 都走同一个端口，登录仅使用管理 token；模型客户端使用网关 token。
#   - .env 权限必须 600：其中含两种 token，且不要提交进版本库。
#   - MOONBRIDGE_KEY_FILE 指向 /data 持久卷内文件；必须与数据库一起备份，丢失/错误拒绝打开。
#     Unix 密钥文件权限为 0600；恢复旧镜像须恢复升级前数据库及匹配凭据材料。
#   - restart 策略用于容器异常退出恢复；管理页面的网关重启在进程内排空后重新监听，
#     不依赖此策略；状态显示实际绑定地址，旧余额调度任务随重启取消。
#   - 私网余额访问通过启动环境 MOONBRIDGE_BALANCE_PRIVATE_ORIGINS 精确 origin JSON 数组授权；
#     不是卡片 extra；元数据地址始终禁止。显式 egressProxy 使余额 HTTP 报不支持代理，
#     不静默直连；网关推理代理仍支持。
#   - 镜像为本地构建，故关闭 watchtower 自动更新，升级靠上面的 save/load 流程。
services:
  moonbridge:
    image: moonbridge-next:local
    container_name: moonbridge
    restart: unless-stopped
    ports:
      - "38440:38440"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
    networks:
      - 1panel-network
    labels:
      com.centurylinklabs.watchtower.enable: "false"

networks:
  1panel-network:
    external: true
