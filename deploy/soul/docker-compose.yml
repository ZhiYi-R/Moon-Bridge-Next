# soul 服务器部署样例：用 moonbridge-next 替换老 Go moonbridge。
#
# 用法（在 soul 上，本目录内）：
#   1. 本地（macOS）构建并导出镜像：
#        docker build -t moonbridge-next:local .          # 仓库根执行
#        docker save moonbridge-next:local | gzip > moonbridge-next-local.tgz
#      scp 到 soul 后导入：
#        gunzip -c moonbridge-next-local.tgz | docker load
#   2. 准备数据目录与环境变量（容器以 uid 10001 运行，宿主目录必须归它所有，
#      否则 ./data 覆盖镜像内 /data 后无法写库与配置）：
#        mkdir -p data && chown -R 10001:10001 data
#        cp .env.example .env && chmod 600 .env           # 填入真实 MOONBRIDGE_ADMIN_TOKEN
#   3. 启动 / 更新：
#        docker compose up -d
#        docker compose logs -f moonbridge
#
# 说明：
#   - 端口 38440 对宿主机开放；公网入口由 openresty（1Panel）反代，再往上是 Cloudflare。
#     前端页面与 /api/* 都走同一个端口，Bearer token 由访问者自行在页面填入。
#   - .env 权限必须 600：其中含 admin token，且不要提交进版本库。
#   - 镜像为本地构建，故关闭 watchtower 自动更新，升级靠上面的 save/load 流程。
services:
  moonbridge:
    image: moonbridge-next:local
    container_name: moonbridge
    restart: unless-stopped
    ports:
      - "38440:38440"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
    networks:
      - 1panel-network
    labels:
      com.centurylinklabs.watchtower.enable: "false"

networks:
  1panel-network:
    external: true
